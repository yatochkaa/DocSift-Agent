[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docsift-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "opencv-python-headless>=4.11,<5",
    "pillow>=11,<12",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "python-multipart>=0.0.20,<1",
    "pytesseract>=0.3.13,<1",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
    "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docsift = ["prompts/document_extraction/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
