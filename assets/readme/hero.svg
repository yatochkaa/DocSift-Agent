<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">DocSift Agent</title>
  <desc id="desc">Локальный конвейер проверки бухгалтерских документов: исходный файл проходит OCR и LLM-извлечение, проверку правил и превращается в подтверждённые данные.</desc>
  <rect width="1200" height="400" rx="26" fill="#111114"/>
  <path d="M0 330H1200M650 0V400" stroke="#FFFFFF" stroke-opacity=".07"/>
  <path d="M48 72H602" stroke="#C8FF62" stroke-width="2"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
