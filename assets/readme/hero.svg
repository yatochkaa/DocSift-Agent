    <text x="48" y="154" fill="#F7F5EF" font-size="74" font-weight="800" letter-spacing="-4">DocSift<tspan fill="#C8FF62">.</tspan></text>
    <text x="48" y="204" fill="#F7F5EF" font-size="26" font-weight="600">Извлечь. Проверить. Подтвердить.</text>
    <text x="48" y="246" fill="#A09DA7" font-size="20">Бухгалтерские документы → проверяемые данные → XLSX</text>

    <g transform="translate(48 284)" font-family="ui-monospace,'Cascadia Code',monospace" font-size="17">
