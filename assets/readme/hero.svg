      <rect x="324" width="116" height="38" rx="9" fill="#18181D" stroke="#FFFFFF" stroke-opacity=".11"/>
      <circle cx="344" cy="19" r="5" fill="#62E4E9"/>
      <text x="358" y="25" fill="#F7F5EF">XLSX</text>
    </g>
  </g>

  <g transform="translate(660 46)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
