<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Конвейер DocSift</title>
  <desc id="desc">Пять этапов: загрузка документа, извлечение текста, структурирование, логические проверки и ручное подтверждение с экспортом.</desc>
  <rect width="1200" height="300" rx="24" fill="#111114"/>
  <text x="48" y="54" fill="#F7F5EF" font-size="34" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">От файла до подтверждённых данных</text>
  <text x="1152" y="52" text-anchor="end" fill="#C8FF62" font-size="17" font-family="ui-monospace,'Cascadia Code',monospace">5 CONTROLLED STAGES</text>

  <g transform="translate(48 92)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g>
      <rect width="190" height="152" rx="14" fill="#18181D" stroke="#FFFFFF" stroke-opacity=".1"/>
      <text x="18" y="32" fill="#C8FF62" font-size="17" font-family="ui-monospace,'Cascadia Code',monospace">01 / INPUT</text>
      <text x="18" y="72" fill="#F7F5EF" font-size="22" font-weight="700">Загрузка</text>
      <text x="18" y="104" fill="#A09DA7" font-size="17">PDF · PNG · JPG</text>
      <text x="18" y="129" fill="#A09DA7" font-size="17">TIFF · magic bytes</text>
    </g>
    <path d="M198 76H226" stroke="#C8FF62" stroke-width="2"/>
    <path d="m219 69 8 7-8 7" fill="none" stroke="#C8FF62" stroke-width="2"/>

    <g transform="translate(234)">
      <rect width="190" height="152" rx="14" fill="#18181D" stroke="#FFFFFF" stroke-opacity=".1"/>
      <text x="18" y="32" fill="#62E4E9" font-size="17" font-family="ui-monospace,'Cascadia Code',monospace">02 / READ</text>
      <text x="18" y="72" fill="#F7F5EF" font-size="22" font-weight="700">Текст + OCR</text>
      <text x="18" y="104" fill="#A09DA7" font-size="17">Текстовый слой</text>
      <text x="18" y="129" fill="#A09DA7" font-size="17">или распознавание</text>
    </g>
    <path d="M432 76H460" stroke="#62E4E9" stroke-width="2"/>
    <path d="m453 69 8 7-8 7" fill="none" stroke="#62E4E9" stroke-width="2"/>

    <g transform="translate(468)">
      <rect width="190" height="152" rx="14" fill="#18181D" stroke="#FFFFFF" stroke-opacity=".1"/>
      <text x="18" y="32" fill="#9D8CFF" font-size="17" font-family="ui-monospace,'Cascadia Code',monospace">03 / EXTRACT</text>
      <text x="18" y="72" fill="#F7F5EF" font-size="22" font-weight="700">Структура</text>
      <text x="18" y="104" fill="#A09DA7" font-size="17">Поля · стороны</text>
      <text x="18" y="129" fill="#A09DA7" font-size="17">позиции · суммы</text>
    </g>
    <path d="M666 76H694" stroke="#9D8CFF" stroke-width="2"/>
    <path d="m687 69 8 7-8 7" fill="none" stroke="#9D8CFF" stroke-width="2"/>

    <g transform="translate(702)">
      <rect width="190" height="152" rx="14" fill="#18181D" stroke="#FFFFFF" stroke-opacity=".1"/>
      <text x="18" y="32" fill="#FF856F" font-size="17" font-family="ui-monospace,'Cascadia Code',monospace">04 / VERIFY</text>
      <text x="18" y="72" fill="#F7F5EF" font-size="22" font-weight="700">Guardrails</text>
      <text x="18" y="104" fill="#A09DA7" font-size="17">ИНН · НДС · даты</text>
      <text x="18" y="129" fill="#A09DA7" font-size="17">суммы · confidence</text>
    </g>
    <path d="M900 76H928" stroke="#FF856F" stroke-width="2"/>
    <path d="m921 69 8 7-8 7" fill="none" stroke="#FF856F" stroke-width="2"/>

    <g transform="translate(936)">
      <rect width="168" height="152" rx="14" fill="#C8FF62" fill-opacity=".1" stroke="#C8FF62" stroke-opacity=".55"/>
      <text x="18" y="32" fill="#C8FF62" font-size="17" font-family="ui-monospace,'Cascadia Code',monospace">05 / REVIEW</text>
      <text x="18" y="72" fill="#F7F5EF" font-size="22" font-weight="700">Человек</text>
      <text x="18" y="104" fill="#A09DA7" font-size="17">Исправление</text>
      <text x="18" y="129" fill="#A09DA7" font-size="17">и экспорт XLSX</text>
    </g>
  </g>
</svg>
